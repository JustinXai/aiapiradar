name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run content validation
        run: npm run validate:content

      - name: Run sitemap generation
        run: npm run generate:sitemap

      - name: Run LLMs generation
        run: npm run generate:llms

      - name: Run verify
        run: npm run verify

      - name: Run build
        run: npm run build

      - name: Run release checks
        run: npm run check:release
